<section class="sect "><h2 class="t">Play, compete, be a champion</h2><p class="lead">Tiga hal yang kami pegang di setiap pertandingan.</p><div class="cards"><div class="card "><h3>Play</h3><p>Bermain dengan senang dan sportif, menang atau kalah.</p></div><div class="card "><h3>Compete</h3><p>Bersaing dengan jujur melawan tim terbaik dari sekolah lain.</p></div><div class="card "><h3>Be a champion</h3><p>Juara dimulai dari disiplin latihan dan kerja sama tim.</p></div></div></section>
