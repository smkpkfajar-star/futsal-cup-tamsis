<!-- Data Tim -->
  <section class="panel">
   <div class="ph"><div class="ico"><svg><use href="#clip"/></svg></div><div><h2>Data Tim</h2><small>Lengkapi informasi tim dan sekolah.</small></div></div>
   <div class="sec">
    <h3><svg><use href="#school"/></svg>Informasi Sekolah</h3>
    <div class="f"><label>Nama Sekolah <s>*</s></label><input placeholder="Masukkan nama sekolah"></div>
    <div class="f"><label>Alamat Sekolah <s>*</s></label><input placeholder="Masukkan alamat lengkap sekolah"></div>
    <div class="two">
     <div><label>Kabupaten/Kota <s>*</s></label><select><option>Pilih kabupaten/kota</option><option>Yogyakarta</option><option>Sleman</option><option>Bantul</option></select></div>
     <div><label>Provinsi <s>*</s></label><select><option>Pilih provinsi</option><option>DI Yogyakarta</option><option>Jawa Tengah</option></select></div>
    </div>
   </div>
   <div class="sec" style="margin-bottom:0">
    <h3><svg><use href="#users"/></svg>Informasi Tim</h3>
    <div class="two f">
     <div><label>Nama Tim <s>*</s></label><input placeholder="Masukkan nama tim"></div>
     <div><label>Nama Pembina <s>*</s></label><input placeholder="Masukkan nama pembina"></div>
    </div>
    <div class="two">
     <div><label>Logo Tim</label>
      <div class="logoRow"><label class="up" style="margin:0"><input type="file" accept="image/png,image/jpeg" hidden><svg><use href="#cloud"/></svg><b>Upload Logo Tim</b>(JPG, PNG - Maks. 2MB)</label>
      <div class="prev"><img class="shieldimg" alt="Logo preview" src="assets/img/shield.png">Logo Preview</div></div></div>
     <div><label>No. HP Pembina <s>*</s></label><input placeholder="0812 3456 7890" inputmode="tel"></div>
    </div>
   </div>
  </section>
